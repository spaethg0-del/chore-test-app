<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fc" />
  <title>Chore Board</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fc;
      color: #1d2433;
    }

    .page {
      min-height: 100vh;
      padding: 28px 18px 110px;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .eyebrow {
      font-size: 13px;
      color: #7a8497;
      margin-bottom: 4px;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      font-size: 31px;
      letter-spacing: -0.7px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e9ecf7;
      font-weight: 700;
      font-size: 17px;
    }

    .summary-card {
      background: #20263a;
      color: white;
      padding: 22px;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(31, 38, 58, 0.16);
      margin-bottom: 22px;
    }

    .summary-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .summary-label {
      font-size: 14px;
      opacity: 0.72;
      margin-bottom: 5px;
    }

    .summary-number {
      font-size: 28px;
      font-weight: 700;
    }

    .percent {
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
    }

    .progress-track {
      height: 9px;
      background: rgba(255,255,255,0.13);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 18px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 99px;
      transition: width 0.25s ease;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 2px 12px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 18px;
    }

    .section-heading span {
      color: #8a93a4;
      font-size: 13px;
    }

    .chore-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chore {
      display: flex;
      align-items: center;
      gap: 14px;
      background: white;
      padding: 17px 16px;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(24, 31, 51, 0.05);
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      user-select: none;
    }

    .chore:active {
      transform: scale(0.985);
    }

    .checkmark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #d6dbe6;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: 900;
      transition: all 0.2s ease;
    }

    .chore-text {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
    }

    .chore.done {
      opacity: 0.58;
    }

    .chore.done .checkmark {
      background: #20263a;
      border-color: #20263a;
      color: white;
    }

    .chore.done .chore-text {
      text-decoration: line-through;
    }

    .add-card {
      background: white;
      margin-top: 18px;
      padding: 14px;
      border-radius: 20px;
      display: flex;
      gap: 10px;
      box-shadow: 0 5px 18px rgba(24, 31, 51, 0.05);
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      background: #f5f6fa;
      padding: 14px 15px;
      border-radius: 14px;
      font-size: 16px;
      min-width: 0;
    }

    .add-button {
      border: none;
      background: #20263a;
      color: white;
      border-radius: 14px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-button {
      width: 100%;
      border: none;
      background: transparent;
      color: #8a93a4;
      padding: 18px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .bottom-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 500px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(225,228,235,0.9);
      box-shadow: 0 12px 30px rgba(25, 31, 48, 0.12);
      border-radius: 22px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-around;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: #8a93a4;
      padding: 7px 0;
    }

    .nav-icon {
      font-size: 20px;
      display: block;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #20263a;
      font-weight: 700;
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 28px;
      }

      .page {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="app">

      <div class="topbar">
        <div>
          <div class="eyebrow">TODAY</div>
          <h1>Chore Board</h1>
        </div>
        <div class="avatar">G</div>
      </div>

      <div class="summary-card">
        <div class="summary-top">
          <div>
            <div class="summary-label">Today's progress</div>
            <div class="summary-number" id="summaryText">0 of 5 done</div>
          </div>
          <div class="percent" id="percentText">0%</div>
        </div>

        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="section-heading">
        <h2>Today's chores</h2>
        <span id="remainingText"></span>
      </div>

      <div class="chore-list" id="choreList"></div>

      <div class="add-card">
        <input
          id="newChore"
          placeholder="Add a new chore"
          onkeydown="handleEnter(event)"
        />
        <button class="add-button" onclick="addChore()">Add</button>
      </div>

      <button class="reset-button" onclick="resetChores()">
        Reset today's progress
      </button>

    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active">
      <span class="nav-icon">⌂</span>
      Home
    </div>

    <div class="nav-item">
      <span class="nav-icon">✓</span>
      Completed
    </div>

    <div class="nav-item">
      <span class="nav-icon">⚙</span>
      Settings
    </div>
  </div>

  <script>
    let chores = [
      { name: "Clean the kitchen", done: false },
      { name: "Do the laundry", done: false },
      { name: "Take out the trash", done: false },
      { name: "Vacuum the floors", done: false },
      { name: "Feed the dog", done: false }
    ];

    function render() {
      const choreList = document.getElementById("choreList");
      choreList.innerHTML = "";

      chores.forEach((chore, index) => {
        const item = document.createElement("div");
        item.className = "chore" + (chore.done ? " done" : "");

        item.innerHTML = `
          <div class="checkmark">${chore.done ? "✓" : ""}</div>
          <div class="chore-text">${chore.name}</div>
        `;

        item.onclick = () => {
          chores[index].done = !chores[index].done;
          render();
        };

        choreList.appendChild(item);
      });

      const completed = chores.filter(chore => chore.done).length;
      const total = chores.length;
      const remaining = total - completed;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById("summaryText").textContent =
        `${completed} of ${total} done`;

      document.getElementById("percentText").textContent =
        `${percent}%`;

      document.getElementById("remainingText").textContent =
        remaining === 1
          ? "1 remaining"
          : `${remaining} remaining`;

      document.getElementById("progressFill").style.width =
        `${percent}%`;
    }

    function addChore() {
      const input = document.getElementById("newChore");
      const name = input.value.trim();

      if (!name) return;

      chores.push({
        name,
        done: false
      });

      input.value = "";
      render();
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        addChore();
      }
    }

    function resetChores() {
      chores.forEach(chore => {
        chore.done = false;
      });

      render();
    }

    render();
  </script>
</body>
</html>
