<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fc" />
  <title>Chore Board</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fc;
      color: #1d2433;
    }

    .page {
      min-height: 100vh;
      padding: 28px 18px 110px;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .eyebrow {
      font-size: 13px;
      color: #7a8497;
      margin-bottom: 4px;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      font-size: 31px;
      letter-spacing: -0.7px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e9ecf7;
      font-weight: 700;
      font-size: 17px;
    }

    .summary-card {
      background: #20263a;
      color: white;
      padding: 22px;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(31, 38, 58, 0.16);
      margin-bottom: 22px;
    }

    .summary-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .summary-label {
      font-size: 14px;
      opacity: 0.72;
      margin-bottom: 5px;
    }

    .summary-number {
      font-size: 28px;
      font-weight: 700;
    }

    .percent {
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
    }

    .progress-track {
      height: 9px;
      background: rgba(255,255,255,0.13);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 18px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 99px;
      transition: width 0.25s ease;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 2px 12px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 18px;
    }

    .section-heading span {
      color: #8a93a4;
      font-size: 13px;
    }

    .chore-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chore {
      display: flex;
      align-items: center;
      gap: 14px;
      background: white;
      padding: 17px 16px;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(24, 31, 51, 0.05);
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      user-select: none;
    }

    .chore:active {
      transform: scale(0.985);
    }

    .checkmark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #d6dbe6;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: 900;
    }

    .chore-text {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
    }

    .chore.done {
      opacity: 0.58;
    }

    .chore.done .checkmark {
      background: #20263a;
      border-color: #20263a;
      color: white;
    }

    .chore.done .chore-text {
      text-decoration: line-through;
    }

    .add-card,
    .settings-card,
    .empty-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 18px rgba(24, 31, 51, 0.05);
    }

    .add-card {
      margin-top: 18px;
      padding: 14px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      background: #f5f6fa;
      padding: 14px 15px;
      border-radius: 14px;
      font-size: 16px;
      min-width: 0;
    }

    .add-button {
      border: none;
      background: #20263a;
      color: white;
      border-radius: 14px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-button {
      width: 100%;
      border: none;
      background: transparent;
      color: #8a93a4;
      padding: 18px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .settings-card {
      overflow: hidden;
    }

    .setting-row {
      padding: 18px;
      border-bottom: 1px solid #eef0f5;
    }

    .setting-row:last-child {
      border-bottom: none;
    }

    .setting-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .setting-copy {
      color: #7a8497;
      font-size: 14px;
      line-height: 1.45;
    }

    .danger-button {
      width: 100%;
      margin-top: 14px;
      border: none;
      background: #fff1f1;
      color: #b42318;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-card {
      padding: 30px 20px;
      text-align: center;
      color: #7a8497;
    }

    .empty-icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 500px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(225,228,235,0.9);
      box-shadow: 0 12px 30px rgba(25, 31, 48, 0.12);
      border-radius: 22px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-around;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: #8a93a4;
      padding: 7px 0;
      cursor: pointer;
    }

    .nav-icon {
      font-size: 20px;
      display: block;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #20263a;
      font-weight: 700;
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 28px;
      }

      .page {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="app">

      <div class="topbar">
        <div>
          <div class="eyebrow" id="eyebrow">TODAY</div>
          <h1 id="pageTitle">Chore Board</h1>
        </div>
        <div class="avatar">G</div>
      </div>

      <div id="screen"></div>

    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" id="homeTab" onclick="showHome()">
      <span class="nav-icon">⌂</span>
      Home
    </div>

    <div class="nav-item" id="completedTab" onclick="showCompleted()">
      <span class="nav-icon">✓</span>
      Completed
    </div>

    <div class="nav-item" id="settingsTab" onclick="showSettings()">
      <span class="nav-icon">⚙</span>
      Settings
    </div>
  </div>

  <script>
    let chores = JSON.parse(localStorage.getItem("chores")) || [
      { name: "Clean the kitchen", done: false },
      { name: "Do the laundry", done: false },
      { name: "Take out the trash", done: false },
      { name: "Vacuum the floors", done: false },
      { name: "Feed the dog", done: false }
    ];

    let currentScreen = "home";

    function saveChores() {
      localStorage.setItem("chores", JSON.stringify(chores));
    }

    function setActiveTab(tab) {
      document.getElementById("homeTab").classList.remove("active");
      document.getElementById("completedTab").classList.remove("active");
      document.getElementById("settingsTab").classList.remove("active");

      document.getElementById(tab + "Tab").classList.add("active");
    }

    function showHome() {
      currentScreen = "home";
      setActiveTab("home");

      document.getElementById("eyebrow").textContent = "TODAY";
      document.getElementById("pageTitle").textContent = "Chore Board";

      const completed = chores.filter(chore => chore.done).length;
      const total = chores.length;
      const remaining = total - completed;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById("screen").innerHTML = `
        <div class="summary-card">
          <div class="summary-top">
            <div>
              <div class="summary-label">Today's progress</div>
              <div class="summary-number">${completed} of ${total} done</div>
            </div>
            <div class="percent">${percent}%</div>
          </div>

          <div class="progress-track">
            <div class="progress-fill" style="width:${percent}%"></div>
          </div>
        </div>

        <div class="section-heading">
          <h2>Today's chores</h2>
          <span>${remaining === 1 ? "1 remaining" : remaining + " remaining"}</span>
        </div>

        <div class="chore-list" id="choreList"></div>

        <div class="add-card">
          <input
            id="newChore"
            placeholder="Add a new chore"
            onkeydown="handleEnter(event)"
          />
          <button class="add-button" onclick="addChore()">Add</button>
        </div>

        <button class="reset-button" onclick="resetChores()">
          Reset today's progress
        </button>
      `;

      renderChoreList(chores);
    }

    function showCompleted() {
      currentScreen = "completed";
      setActiveTab("completed");

      document.getElementById("eyebrow").textContent = "HISTORY";
      document.getElementById("pageTitle").textContent = "Completed";

      const completedChores = chores.filter(chore => chore.done);

      document.getElementById("screen").innerHTML = `
        <div class="section-heading">
          <h2>Finished chores</h2>
          <span>${completedChores.length} completed</span>
        </div>

        <div class="chore-list" id="choreList"></div>
      `;

      if (completedChores.length === 0) {
        document.getElementById("choreList").innerHTML = `
          <div class="empty-card">
            <div class="empty-icon">✓</div>
            No chores completed yet.
          </div>
        `;
      } else {
        renderChoreList(completedChores);
      }
    }

    function showSettings() {
      currentScreen = "settings";
      setActiveTab("settings");

      document.getElementById("eyebrow").textContent = "APP";
      document.getElementById("pageTitle").textContent = "Settings";

      document.getElementById("screen").innerHTML = `
        <div class="settings-card">

          <div class="setting-row">
            <div class="setting-title">Chore storage</div>
            <div class="setting-copy">
              Your chores are saved on this device, so they stay here when you refresh or reopen the app.
            </div>
          </div>

          <div class="setting-row">
            <div class="setting-title">Today's list</div>
            <div class="setting-copy">
              You currently have ${chores.length} chores.
            </div>
          </div>

          <div class="setting-row">
            <div class="setting-title">Reset app</div>
            <div class="setting-copy">
              Remove all current chores and restore the original sample list.
            </div>

            <button class="danger-button" onclick="restoreDefaults()">
              Restore default chores
            </button>
          </div>

        </div>
      `;
    }

    function renderChoreList(list) {
      const container = document.getElementById("choreList");
      container.innerHTML = "";

      list.forEach(chore => {
        const actualIndex = chores.indexOf(chore);

        const item = document.createElement("div");
        item.className = "chore" + (chore.done ? " done" : "");

        item.innerHTML = `
          <div class="checkmark">${chore.done ? "✓" : ""}</div>
          <div class="chore-text">${chore.name}</div>
        `;

        item.onclick = () => {
          chores[actualIndex].done = !chores[actualIndex].done;
          saveChores();

          if (currentScreen === "completed") {
            showCompleted();
          } else {
            showHome();
          }
        };

        container.appendChild(item);
      });
    }

    function addChore() {
      const input = document.getElementById("newChore");
      const name = input.value.trim();

      if (!name) return;

      chores.push({
        name,
        done: false
      });

      saveChores();
      showHome();
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        addChore();
      }
    }

    function resetChores() {
      chores.forEach(chore => {
        chore.done = false;
      });

      saveChores();
      showHome();
    }

    function restoreDefaults() {
      chores = [
        { name: "Clean the kitchen", done: false },
        { name: "Do the laundry", done: false },
        { name: "Take out the trash", done: false },
        { name: "Vacuum the floors", done: false },
        { name: "Feed the dog", done: false }
      ];

      saveChores();
      showSettings();
    }

    showHome();
  </script>
</body>
</html>
